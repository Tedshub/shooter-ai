<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame Visualization - Auto Targeting System</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
        }
        
        h1 {
            text-align: center;
            color: black;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        svg {
            width: 100%;
            height: auto;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .frame-bg {
            fill: #ffffff;
        }
        
        .dimension-text {
            font-family: Arial, sans-serif;
            font-size: 18px;
            fill: #000000;
            font-weight: bold;
        }
        
        .dimension-line {
            stroke: #000000;
            stroke-width: 2;
        }
        
        .green-box {
            fill: none;
            stroke: #00ff00;
            stroke-width: 3;
        }
        
        .yellow-box {
            fill: none;
            stroke: #ffff00;
            stroke-width: 3;
        }
        
        .crosshair-v {
            stroke: #00ff00;
            stroke-width: 2;
            stroke-dasharray: 10, 5; 
        }
        
        .crosshair-h {
            stroke: #00ff00;
            stroke-width: 2;
            stroke-dasharray: 10, 5;
        }
        
        .center-circle {
            fill: none;
            stroke: #00ff00;
            stroke-width: 2;
        }
        
        .red-dot {
            fill: #ff0000;
            stroke: white;
            stroke-width: 2;
        }
        
        .text-green {
            font-family: Arial, sans-serif;
            font-size: 20px;
            fill: #00ff00;
            font-weight: bold;
        }
        
        .text-yellow {
            font-family: Arial, sans-serif;
            font-size: 20px;
            fill: #b0b000;
            font-weight: bold;
        }
        
        .text-bottom {
            font-family: Arial, sans-serif;
            font-size: 16px;
            fill: #000000;
            font-weight: bold;
        }
        
        .text-center-coord {
            font-family: Arial, sans-serif;
            font-size: 16px;
            fill: #ffffff;
            font-weight: bold;
        }
        
        .label-bg-green {
            fill: #00ff00;
        }
        
        .label-bg-yellow {
            fill: #ffff00;
        }
        
        .label-text-black {
            font-family: Arial, sans-serif;
            font-size: 18px;
            fill: #000000;
            font-weight: bold;
        }
        
        @media print {
            body {
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real-time Object Detection Display<br>Resolution: 640×480 pixels @ 30 FPS</h1>
        
        <svg viewBox="0 0 1400 1080" xmlns="http://www.w3.org/2000/svg">
            <!-- Definitions for Gradients and Shadows -->
            <defs>
                <!-- Radial Gradient for the 3D Red Ball effect -->
                <radialGradient id="redBallGradient" cx="35%" cy="35%" r="60%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#ffcccc;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#ff0000;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
                </radialGradient>
                
                <!-- Filter for slight drop shadow on balls for depth -->
                <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
                    <feOffset dx="2" dy="2" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Background frame (simulating camera view) -->
            <rect x="60" y="80" width="1280" height="960" class="frame-bg"/>
            <rect x="60" y="80" width="1280" height="960" style="fill: none; stroke: black; stroke-width: 3;"/>
            
            <!-- Dimension Lines and Labels -->
            <!-- Top - Width dimension -->
            <line x1="60" y1="50" x2="1340" y2="50" class="dimension-line"/>
            <line x1="60" y1="45" x2="60" y2="55" class="dimension-line"/>
            <line x1="1340" y1="45" x2="1340" y2="55" class="dimension-line"/>
            <text x="700" y="35" text-anchor="middle" class="dimension-text">640 pixels (Width / X-axis)</text>
            
            <!-- Left - Height dimension -->
            <line x1="30" y1="80" x2="30" y2="1040" class="dimension-line"/>
            <line x1="25" y1="80" x2="35" y2="80" class="dimension-line"/>
            <line x1="25" y1="1040" x2="35" y2="1040" class="dimension-line"/>
            <text x="15" y="560" text-anchor="middle" class="dimension-text" transform="rotate(-90 15 560)">480 pixels (Height / Y-axis)</text>
            
            <!-- Corner Pixel Coordinates -->
            <text x="65" y="100" class="dimension-text" style="font-size: 18px;">(0,0)</text>
            <text x="1280" y="100" class="dimension-text" style="font-size: 18px;">(640,0)</text>
            <text x="65" y="1025" class="dimension-text" style="font-size: 18px;">(0,480)</text>
            <text x="1260" y="1025" class="dimension-text" style="font-size: 18px;">(640,480)</text>
            
            <!-- OBJECT #1 (Green Priority - CENTER) -->
            <!-- Coordinates: (320, 240) -> SVG (700, 560) -->
            
            <!-- Red Ball #1 -->
            <circle cx="700" cy="560" r="105" fill="url(#redBallGradient)" filter="url(#ballShadow)" />
            
            <!-- Green Detection Box #1 -->
            <rect x="580" y="450" width="240" height="220" class="green-box"/>

            <!-- OBJECT #2 (Yellow Secondary - UPDATED TO 106,287) -->
            <!-- Calculation: 
                 Camera (106, 287) 
                 Scale x2 + Offset(60,80) -> SVG (272, 654)
                 Box Size: 260x200. Top-Left: (272-130, 654-100) = (142, 554)
            -->
            
            <!-- Red Ball #2 -->
            <circle cx="272" cy="654" r="95" fill="url(#redBallGradient)" filter="url(#ballShadow)" />

            <!-- Yellow Detection Box #2 -->
            <rect x="142" y="554" width="260" height="200" class="yellow-box"/>

            <!-- Center Crosshair (Vertical line) -->
            <line x1="700" y1="80" x2="700" y2="1040" class="crosshair-v"/>
            
            <!-- Center Crosshair (Horizontal line) -->
            <line x1="60" y1="560" x2="1340" y2="560" class="crosshair-h"/>
            
            <!-- Center Circle -->
            <circle cx="700" cy="560" r="20" class="center-circle"/>
            <circle cx="700" cy="560" r="3" style="fill: #00ff00;"/>
            
<rect x="690" y="525" width="160" height="30" rx="4" ry="4" fill="black" />

<text x="705" y="545" class="text-center-coord">
    Center: (320, 240)
</text>
            <!-- Red center dots on detected objects (Placed ON TOP of balls) -->
            <circle cx="700" cy="560" r="8" class="red-dot"/>
            <!-- Dot #2 Updated Position -->
            <circle cx="272" cy="654" r="8" class="red-dot"/>
            
            <!-- No tracking line drawn because Target #1 is in the exact center -->
            
            <!-- Label for Green Box #1 (Priority) -->
            <rect x="580" y="420" width="240" height="30" class="label-bg-green"/>
            <text x="590" y="442" class="label-text-black">#1 (320, 240) Conf:0.91</text>
            
            <!-- Label for Yellow Box #2 (Updated Position and Text) -->
            <rect x="142" y="524" width="260" height="30" class="label-bg-yellow"/>
            <text x="152" y="546" class="label-text-black">#2 (106, 287) Conf:0.85</text>
            
            <!-- Top Left - Model Info -->
            <text x="80" y="120" class="text-green">MODEL: red_ball.pt</text>
            
            <!-- Top Right - Mode and Status -->
            <text x="1090" y="120" class="text-yellow">AUTO MODE</text>
            <text x="1060" y="160" class="text-green">SERIAL: CONNECTED</text>
            
            <!-- Bottom Info - Servo Positions (BLACK TEXT) -->
            <text x="80" y="1000" class="text-bottom">S1:90° (25-155°)  S2:90° (15-165°)  S3:0° (0-43°)</text>
            
        </svg>

    </div>
</body>
</html>
